<!DOCTYPE html>
<html>
<head>
    <title>Download TikTok</title>
</head>
<body>
    <h2>Download Video TikTok</h2>
    <input type="text" id="url" placeholder="Masukkan link TikTok" style="width:300px">
    <button onclick="downloadVideo()">Download</button>

    <script>
    async function downloadVideo() {
        const url = document.getElementById('url').value;
        if(!url) { 
            alert('Masukkan link TikTok dulu!'); 
            return; 
        }

        try {
            // Ganti URL ini dengan API-mu
            const apiURL = `http://localhost:3000/${encodeURIComponent(url)}`;
            const response = await fetch(apiURL);
            const data = await response.json();

            if(data.video) {
                const a = document.createElement('a');
                a.href = data.video;
                a.download = 'tiktok.mp4';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } else {
                alert('Gagal mendapatkan video, cek link TikTok-mu');
            }
        } catch (err) {
            console.error(err);
            alert('Terjadi kesalahan, coba lagi');
        }
    }
    </script>
</body>
</html>
